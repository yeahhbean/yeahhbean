name: Update profile analytics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'yeahhbean/yeahhbean'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test calendar parsing and card generation
        run: python3 -m unittest discover -s tests -v
      - name: Refresh cards from GitHub's public calendar
        run: python3 scripts/update_profile.py
      - name: Commit refreshed cards
        run: |
          git add -- profile/stats.svg profile/activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile contribution cards'
          git push
